# Federatief Berichtenstelsel - Full Stack
# Gebruik: docker compose up -d
#
# Bevat alle applicatie-services plus dependencies.
# Dependencies worden ge-include vanuit docker-compose.deps.yml.

include:
  - docker-compose.deps.yml

services:

  # ============================================================
  # FBS Applicatie Services
  # Dockerfiles worden aangemaakt in Fase 7.
  # ============================================================

  # --- Bericht Service ---
  # Kernservice voor berichten CRUD, opslag in PostgreSQL + MinIO
  # Publiceert events naar Kafka topics
  # bericht-service:
  #   build:
  #     context: ../services/bericht-service
  #     dockerfile: src/main/docker/Dockerfile.jvm
  #   ports:
  #     - "8081:8080"
  #   environment:
  #     QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/fbs
  #     QUARKUS_DATASOURCE_USERNAME: fbs
  #     QUARKUS_DATASOURCE_PASSWORD: fbs
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  #     MINIO_ENDPOINT: http://minio:9000
  #     OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy

  # --- Notificatie Service ---
  # Consumeert Kafka events en verstuurt notificaties
  # notificatie-service:
  #   build:
  #     context: ../services/notificatie-service
  #     dockerfile: src/main/docker/Dockerfile.jvm
  #   ports:
  #     - "8082:8080"
  #   environment:
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  #     OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  #   depends_on:
  #     kafka:
  #       condition: service_healthy

  # --- Abonnement Service ---
  # Beheert abonnementen/voorkeuren voor notificaties
  # abonnement-service:
  #   build:
  #     context: ../services/abonnement-service
  #     dockerfile: src/main/docker/Dockerfile.jvm
  #   ports:
  #     - "8083:8080"
  #   environment:
  #     QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/fbs
  #     QUARKUS_DATASOURCE_USERNAME: fbs
  #     QUARKUS_DATASOURCE_PASSWORD: fbs
  #     OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # --- API Gateway ---
  # Ingang voor externe partijen, routeert naar interne services
  # api-gateway:
  #   build:
  #     context: ../services/api-gateway
  #     dockerfile: src/main/docker/Dockerfile.jvm
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  #   depends_on:
  #     - bericht-service
  #     - notificatie-service
  #     - abonnement-service
