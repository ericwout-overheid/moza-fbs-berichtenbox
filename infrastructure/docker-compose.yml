# Federatief Berichtenstelsel - Full Stack
# Gebruik: docker compose -f infrastructure/docker-compose.yml up -d
#
# Bevat alle applicatie-services plus dependencies.
# Dependencies worden ge-include vanuit docker-compose.deps.yml.

include:
  - docker-compose.deps.yml

services:

  # ============================================================
  # FBS Applicatie Services
  # Dockerfiles worden aangemaakt in Fase 7.
  # ============================================================

  # --- Berichtenmagazijn ---
  # Kernservice voor berichten CRUD, opslag in PostgreSQL + MinIO
  # Publiceert events naar Kafka topics
  # berichtenmagazijn:
  #   build:
  #     context: ../services/berichtenmagazijn
  #     dockerfile: src/main/docker/Dockerfile.jvm
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/fbs
  #     QUARKUS_DATASOURCE_USERNAME: fbs
  #     QUARKUS_DATASOURCE_PASSWORD: fbs
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  #     MINIO_ENDPOINT: http://minio:9000
  #     OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy

  # --- Berichtenlijst ---
  # Aggregeert berichtrecords met routering naar opslaglocaties
  # berichtenlijst:
  #   build:
  #     context: ../services/berichtenlijst
  #     dockerfile: src/main/docker/Dockerfile.jvm
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

  # --- Notificatie ---
  # Consumeert Kafka events en verstuurt notificaties (email, SMS)
  # notificatie:
  #   build:
  #     context: ../services/notificatie
  #     dockerfile: src/main/docker/Dockerfile.jvm
  #   ports:
  #     - "8082:8082"
  #   environment:
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  #     OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  #   depends_on:
  #     kafka:
  #       condition: service_healthy

  # --- Notificatieprofiel ---
  # Beheert notificatievoorkeuren van ontvangers
  # notificatieprofiel:
  #   build:
  #     context: ../services/notificatieprofiel
  #     dockerfile: src/main/docker/Dockerfile.jvm
  #   ports:
  #     - "8083:8083"
  #   environment:
  #     QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/fbs
  #     QUARKUS_DATASOURCE_USERNAME: fbs
  #     QUARKUS_DATASOURCE_PASSWORD: fbs
  #     OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # --- Digitale Bereikbaarheid ---
  # Beheert toestemming voor digitale berichtgeving
  # digitale-bereikbaarheid:
  #   build:
  #     context: ../services/digitale-bereikbaarheid
  #     dockerfile: src/main/docker/Dockerfile.jvm
  #   ports:
  #     - "8084:8084"
  #   environment:
  #     QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/fbs
  #     QUARKUS_DATASOURCE_USERNAME: fbs
  #     QUARKUS_DATASOURCE_PASSWORD: fbs
  #     OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

