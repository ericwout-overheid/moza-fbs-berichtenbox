description:
  nl:
    shortDescription: >-
      Oefenproject: referentie-implementatie eigen berichtenmagazijn voor het
      Federatief Berichtenstelsel
    longDescription: >-
      Persoonlijk oefenproject voor het werken met Claude Code en de agent
      skills van developer.overheid.nl en Logius Standaarden. Bevat een
      referentie-implementatie van een eigen berichtenmagazijn voor het
      Federatief Berichtenstelsel (FBS), inclusief een FBS Client SDK.
      Dit is geen officieel product van Logius, BZK of enige andere
      overheidsorganisatie.
    features:
      - Eigen berichtenmagazijn (FBS-compliant berichtenopslag)
      - FBS Client SDK (Kotlin-bibliotheek)
      - NLGov API Design Rules compliant
      - FSC (Federated Service Connectivity) via OpenFSC
      - LDV (Logboek Dataverwerkingen) audit logging
      - CloudEvents NL GOV profiel voor berichtevents
      - Haven/Kubernetes deployment ready

