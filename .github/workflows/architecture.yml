name: Architecture Site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/architecture/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate static site
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/docs/architecture:/var/model \
            ghcr.io/avisi-cloud/structurizr-site-generatr:1.5.2 \
            generate-site -w workspace.dsl

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/architecture/build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
