# ---------------------------------------------------------------------------
# Deploy stage - Kubernetes deployment (Fase 7)
# ---------------------------------------------------------------------------
deploy:staging:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "TODO - Deploy naar staging K8s cluster (Fase 7)"
    # - kubectl apply -k infrastructure/k8s/overlays/staging/
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

deploy:production:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "TODO - Deploy naar productie K8s cluster (Fase 7)"
    # - kubectl apply -k infrastructure/k8s/overlays/production/
  environment:
    name: production
  needs:
    - deploy:staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
