# Federatief Berichtenstelsel - GitLab CI/CD Pipeline
#
# Stages:
#   build  - Compileer alle modules
#   test   - Unit tests en integratie tests
#   lint   - OpenAPI spec linting
#   docker - Docker images bouwen (Fase 7)
#   deploy - Deploy naar Kubernetes (Fase 7)

stages:
  - build
  - test
  - lint
  - docker
  - deploy

# ---------------------------------------------------------------------------
# Globale variabelen
# ---------------------------------------------------------------------------
variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  JAVA_HOME: "/opt/java/openjdk"

# ---------------------------------------------------------------------------
# Cache: Gradle dependencies tussen builds
# ---------------------------------------------------------------------------
.gradle-cache: &gradle-cache
  cache:
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
        - gradle/libs.versions.toml
      prefix: gradle
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
      - .gradle/notifications/
    policy: pull-push

# ---------------------------------------------------------------------------
# Build stage
# ---------------------------------------------------------------------------
build:
  stage: build
  image: eclipse-temurin:21-jdk
  <<: *gradle-cache
  script:
    - chmod +x ./gradlew
    - ./gradlew build -x test -x check
  artifacts:
    paths:
      - "**/build/"
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Test stage
# ---------------------------------------------------------------------------
test:
  stage: test
  image: eclipse-temurin:21-jdk
  <<: *gradle-cache
  needs:
    - build
  script:
    - chmod +x ./gradlew
    - ./gradlew check
  artifacts:
    when: always
    paths:
      - "**/build/reports/"
    reports:
      junit:
        - "**/build/test-results/test/TEST-*.xml"
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Lint stage - OpenAPI spec validatie
# ---------------------------------------------------------------------------
lint:openapi:
  stage: lint
  image: node:20-alpine
  script:
    - npm install -g @stoplight/spectral-cli
    - echo "TODO - OpenAPI specs linting met Spectral (Fase 1)"
    # - spectral lint openapi/*.yaml --ruleset .spectral.yml
  allow_failure: true  # TODO: verwijder wanneer Spectral linting is geconfigureerd
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Docker stage - Container images bouwen (Fase 7)
# ---------------------------------------------------------------------------
.docker-build:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: "$CI_REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_SHORT_SHA"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - echo "TODO - Docker build voor $SERVICE_NAME (Fase 7)"
    # - docker build -t $IMAGE_TAG services/$SERVICE_NAME/
    # - docker push $IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

