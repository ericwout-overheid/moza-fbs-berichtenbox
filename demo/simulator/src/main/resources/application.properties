quarkus.application.name=fbs-demo-simulator
quarkus.http.port=8092

# CORS (frontend dev server)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,API-Version

# FBS Client SDK config
fbs.berichtenmagazijn.url=http://localhost:8083
fbs.berichtenlijst.url=http://localhost:8081
fbs.admin.bearer-token=demo-token
