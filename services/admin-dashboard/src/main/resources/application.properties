# Admin Dashboard - Application Configuration
# ==============================================

# Application
quarkus.application.name=admin-dashboard

# HTTP
quarkus.http.port=8085

# Vaadin
quarkus.vaadin.productionMode=false

# FBS Service URLs
fbs.berichtenmagazijn.url=http://localhost:8080
fbs.berichtenlijst.url=http://localhost:8081
fbs.notificatie.url=http://localhost:8082
fbs.notificatieprofiel.url=http://localhost:8083
fbs.bereikbaarheid.url=http://localhost:8084
fbs.admin.bearer-token=${FBS_ADMIN_BEARER_TOKEN:}
%dev.fbs.admin.bearer-token=admin-demo-token

# Health check targets
fbs.health.urls=http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084

# Jaeger UI
fbs.jaeger.ui.url=http://localhost:16686
