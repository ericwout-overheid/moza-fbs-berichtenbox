# Digitale Bereikbaarheid - Application Configuration
# =====================================================

# Application
quarkus.application.name=digitale-bereikbaarheid

# HTTP
quarkus.http.port=8084

# Datasource (dev profile)
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/fbs
%dev.quarkus.datasource.username=fbs
%dev.quarkus.datasource.password=fbs

# Hibernate ORM - Flyway manages schema
quarkus.hibernate-orm.database.generation=none

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.table=flyway_schema_history_digitale_bereikbaarheid

# LDV / OpenTelemetry
%dev.otel.exporter.otlp.endpoint=http://localhost:4317

# OpenAPI
quarkus.smallrye-openapi.info-title=Digitale Bereikbaarheid API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Federatief Berichtenstelsel - Digitale Bereikbaarheid Service
