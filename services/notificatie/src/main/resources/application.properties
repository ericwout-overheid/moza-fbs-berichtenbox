# Notificatie - Application Configuration
# =========================================

# Application
quarkus.application.name=notificatie

# HTTP
quarkus.http.port=8082

# Datasource (dev profile)
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/fbs
%dev.quarkus.datasource.username=fbs
%dev.quarkus.datasource.password=fbs

# Hibernate ORM - Flyway manages schema
quarkus.hibernate-orm.database.generation=none

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.table=flyway_schema_history_notificatie

# Kafka
%dev.kafka.bootstrap.servers=localhost:29092

# Kafka incoming channels
mp.messaging.incoming.bericht-ontvangen.connector=smallrye-kafka
mp.messaging.incoming.bericht-ontvangen.topic=nl.fbs.bericht-ontvangen
mp.messaging.incoming.bericht-ontvangen.value.deserializer=io.cloudevents.kafka.CloudEventDeserializer
mp.messaging.incoming.bericht-ontvangen.group.id=notificatie-service
mp.messaging.incoming.bericht-ontvangen.failure-strategy=dead-letter-queue
mp.messaging.incoming.bericht-ontvangen.dead-letter-queue.topic=nl.fbs.bericht-ontvangen.dlq

# Kafka outgoing channels
mp.messaging.outgoing.notificatie-verzonden.connector=smallrye-kafka
mp.messaging.outgoing.notificatie-verzonden.topic=nl.fbs.notificatie-verzonden
mp.messaging.outgoing.notificatie-verzonden.value.serializer=io.cloudevents.kafka.CloudEventSerializer

# Mailer
quarkus.mailer.from=noreply@fbs.nl
%dev.quarkus.mailer.mock=true

# REST Client - Notificatieprofiel API
quarkus.rest-client.notificatieprofiel-api.url=http://localhost:8083

# LDV / OpenTelemetry
%dev.otel.exporter.otlp.endpoint=http://localhost:4317

# OpenAPI
quarkus.smallrye-openapi.info-title=Notificatie API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Federatief Berichtenstelsel - Notificatie Service

# OIDC (disabled in dev)
%dev.quarkus.oidc.enabled=false
