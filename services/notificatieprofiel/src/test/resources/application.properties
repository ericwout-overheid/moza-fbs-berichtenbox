# Test configuration - overrides for Quarkus test mode
quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21

# Disable Quarkus Dev Services - we manage containers via ProfielTestResource
quarkus.devservices.enabled=false

# OIDC disabled for tests (build-time property)
quarkus.oidc.enabled=false
