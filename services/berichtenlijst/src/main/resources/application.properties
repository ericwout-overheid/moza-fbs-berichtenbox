# Berichtenlijst - Application Configuration
# =============================================

# Application
quarkus.application.name=berichtenlijst

# HTTP
quarkus.http.port=8081

# REST Client - Berichtenmagazijn
quarkus.rest-client.berichtenmagazijn-api.url=http://localhost:8080

# Cache
quarkus.cache.enabled=true
quarkus.cache.caffeine."berichtenlijst-cache".expire-after-write=60S
quarkus.cache.caffeine."berichtenlijst-zoek-cache".expire-after-write=60S

# LDV / OpenTelemetry
%dev.otel.exporter.otlp.endpoint=http://localhost:4317

# OpenAPI (ADR: /openapi.json VERPLICHT)
quarkus.smallrye-openapi.path=/openapi.json
quarkus.smallrye-openapi.info-title=Berichtenlijst API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Federatief Berichtenstelsel - Berichtenlijst Service
