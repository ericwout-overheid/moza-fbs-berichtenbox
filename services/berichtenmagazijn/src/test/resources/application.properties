# Random port voor tests zodat parallelle Gradle modules niet conflicteren
quarkus.http.test-port=0

# Test configuration - overrides for Quarkus test mode
quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21

# Disable Quarkus Dev Services - we manage containers via FbsTestResource
quarkus.devservices.enabled=false

# Security - dev mode in tests
fbs.security.dev-mode=true
quarkus.oidc.enabled=false

# LDV pseudonimisering (test zout)
fbs.ldv.pseudonimisering.zout=test-zout-minimaal-32-tekens-lang!
