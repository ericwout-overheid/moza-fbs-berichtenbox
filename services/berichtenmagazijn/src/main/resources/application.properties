# Berichtenmagazijn - Application Configuration
# ================================================

# Application
quarkus.application.name=berichtenmagazijn

# HTTP
quarkus.http.port=8083
quarkus.http.body.max-body-size=10M

# Datasource (dev profile)
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/fbs
%dev.quarkus.datasource.username=fbs
%dev.quarkus.datasource.password=fbs

# Hibernate ORM - Flyway manages schema
quarkus.hibernate-orm.database.generation=none

# Flyway
quarkus.flyway.migrate-at-start=true

# Kafka
%dev.kafka.bootstrap.servers=localhost:29092

# Kafka producer durability
kafka.acks=all
kafka.retries=3
kafka.enable.idempotence=true
kafka.max.in.flight.requests.per.connection=1

# Kafka outgoing channels (topic names behouden nl.fbs prefix)
mp.messaging.outgoing.bericht-ontvangen.connector=smallrye-kafka
mp.messaging.outgoing.bericht-ontvangen.topic=nl.fbs.bericht-ontvangen
mp.messaging.outgoing.bericht-ontvangen.value.serializer=io.cloudevents.kafka.CloudEventSerializer

mp.messaging.outgoing.bericht-gelezen.connector=smallrye-kafka
mp.messaging.outgoing.bericht-gelezen.topic=nl.fbs.bericht-gelezen
mp.messaging.outgoing.bericht-gelezen.value.serializer=io.cloudevents.kafka.CloudEventSerializer

mp.messaging.outgoing.bericht-verwijderd.connector=smallrye-kafka
mp.messaging.outgoing.bericht-verwijderd.topic=nl.fbs.bericht-verwijderd
mp.messaging.outgoing.bericht-verwijderd.value.serializer=io.cloudevents.kafka.CloudEventSerializer

# MinIO
%dev.minio.endpoint=http://localhost:9000
%dev.minio.access-key=minioadmin
%dev.minio.secret-key=minioadmin
%dev.minio.bucket=fbs-berichten

# LDV / OpenTelemetry
%dev.otel.exporter.otlp.endpoint=http://localhost:4317

# OpenAPI (ADR: /openapi.json VERPLICHT)
quarkus.smallrye-openapi.path=/openapi.json
quarkus.smallrye-openapi.info-title=Berichtenmagazijn API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Federatief Berichtenstelsel - Berichtenmagazijn Service

# Security - dev mode schakelt authenticatie/autorisatie uit
fbs.security.dev-mode=true
fbs.dev.afzender-oin=00000001234567890000

# OIDC (productie: overschrijf met echte auth-server URL)
quarkus.oidc.enabled=false
%prod.quarkus.oidc.enabled=true
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID}
%prod.fbs.security.dev-mode=false

# AuthZEN / FTV
fbs.authzen.pdp-url=http://localhost:8090

# LDV pseudonimisering (SECURITY: gebruik in productie een sterk geheim via env var)
fbs.ldv.pseudonimisering.zout=dev-zout-minimaal-32-tekens-lang!
