# Berichtenmagazijn - Application Configuration
# ================================================

# Application
quarkus.application.name=berichtenmagazijn

# HTTP
quarkus.http.port=8080

# Datasource
quarkus.datasource.db-kind=postgresql
# quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/berichtenmagazijn
# quarkus.datasource.username=
# quarkus.datasource.password=

# Flyway
quarkus.flyway.migrate-at-start=true

# Kafka
# kafka.bootstrap.servers=localhost:9092

# OpenAPI
quarkus.smallrye-openapi.info-title=Berichtenmagazijn API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Federatief Berichtenstelsel - Berichtenmagazijn Service

# OIDC
# quarkus.oidc.auth-server-url=
# quarkus.oidc.client-id=

# Health & Metrics
quarkus.health.extensions.enabled=true
